<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Projetos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen p-8">

    <header class="max-w-6xl mx-auto mb-10 text-center">
        <h1 class="text-4xl font-bold text-gray-900 mb-2">Painel de <span class="text-[#ff5510]">Projetos</span></h1>
        <p class="text-gray-500">Acompanhamento em tempo real da equipe</p>
    </header>

    <main class="max-w-6xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden border border-gray-200">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-100 text-gray-600 text-sm uppercase tracking-wider border-b border-gray-200">
                        <th class="p-4 font-semibold">Colaborador</th>
                        <th class="p-4 font-semibold">Função</th>
                        <th class="p-4 font-semibold w-1/2">Projetos Atuais</th>
                        <th class="p-4 font-semibold text-center">Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-colaboradores" class="divide-y divide-gray-100">
                    <!-- O conteúdo será injetado aqui pelo JavaScript -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Script do Firebase e Lógica da Página -->
    <script type="module">
        // Importando as funções do Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

        // Suas credenciais (copiadas do seu print!)
        const firebaseConfig = {
            apiKey: "AIzaSyBaEXtoqF1xWmNPVd2o4pO7KOak80-RnO4",
            authDomain: "painel-de-projetos-nortemg.firebaseapp.com",
            projectId: "painel-de-projetos-nortemg",
            storageBucket: "painel-de-projetos-nortemg.firebasestorage.app",
            messagingSenderId: "244006546512",
            appId: "1:244006546512:web:d6cd448699f52ea37af555"
        };

        // Inicializando o Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Lista de Colaboradores Base
        const colaboradores = [
            { nome: "Anna Karla", funcao: "Analista" },
            { nome: "Samia Beatriz", funcao: "Analista" },
            { nome: "Gustavo Basse", funcao: "Analista" },
            { nome: "Camila Moreira", funcao: "Analista" },
            { nome: "Juliane Pereira", funcao: "Analista" },
            { nome: "Isabella Tironni", funcao: "Anjo" },
            { nome: "Bianca Mendonça", funcao: "Anjo" },
            { nome: "Kátia Bandeira", funcao: "Anjo" },
            { nome: "Allex Costa", funcao: "Anjo" }
        ];

        const tabela = document.getElementById('tabela-colaboradores');
        let projetosGlobal = [];

        // Escutando o banco de dados em tempo real
        onSnapshot(collection(db, "projetos"), (snapshot) => {
            projetosGlobal = [];
            snapshot.forEach((doc) => {
                projetosGlobal.push({ id: doc.id, ...doc.data() });
            });
            renderizarTabela();
        });

        // Função para desenhar a tabela
        function renderizarTabela() {
            tabela.innerHTML = '';
            
            colaboradores.forEach((colab, index) => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50 transition-colors";
                
                // Filtrar projetos dessa pessoa
                const projetosPessoa = projetosGlobal.filter(p => p.colaborador === colab.nome);
                
                // HTML dos projetos com Tooltip e Select de Status
                let projetosHTML = projetosPessoa.map(proj => `
                    <div class="group relative flex items-center justify-between bg-gray-50 border border-gray-200 rounded p-2 mb-2">
                        <div class="flex items-center gap-2 flex-1">
                            <span class="font-medium text-gray-800">${proj.nomeProjeto}</span>
                            ${proj.descricao ? `
                                <div class="relative flex items-center justify-center w-5 h-5 bg-gray-300 text-white rounded-full cursor-help hover:bg-gray-400">
                                    <i class="fa-solid fa-exclamation text-xs"></i>
                                    <div class="absolute bottom-full mb-2 hidden group-hover:block w-48 p-2 bg-gray-800 text-white text-xs rounded shadow-lg z-10">
                                        ${proj.descricao}
                                    </div>
                                </div>
                            ` : ''}
                        </div>
                        <div class="flex items-center gap-3">
                            <select onchange="window.mudarStatus('${proj.id}', this.value)" class="text-xs rounded border-gray-300 focus:ring-[#ff5510] focus:border-[#ff5510] p-1 
                                ${proj.status === 'Em andamento' ? 'bg-blue-100 text-blue-800' : 
                                  proj.status === 'Finalizado' ? 'bg-green-100 text-green-800' : 
                                  'bg-yellow-100 text-yellow-800'}">
                                <option value="Em andamento" ${proj.status === 'Em andamento' ? 'selected' : ''}>Em andamento</option>
                                <option value="Stand By" ${proj.status === 'Stand By' ? 'selected' : ''}>Stand By</option>
                                <option value="Finalizado" ${proj.status === 'Finalizado' ? 'selected' : ''}>Finalizado</option>
                            </select>
                            <button onclick="window.deletarProjeto('${proj.id}')" class="text-gray-400 hover:text-red-500 transition-colors" title="Excluir projeto">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                        </div>
                    </div>
                `).join('');

                tr.innerHTML = `
                    <td class="p-4 border-t border-gray-100 font-medium text-gray-800">${colab.nome}</td>
                    <td class="p-4 border-t border-gray-100">
                        <span class="px-3 py-1 rounded-full text-xs font-semibold ${colab.funcao === 'Analista' ? 'bg-blue-100 text-blue-700' : 'bg-purple-100 text-purple-700'}">
                            ${colab.funcao}
                        </span>
                    </td>
                    <td class="p-4 border-t border-gray-100 align-top">
                        ${projetosHTML || '<span class="text-gray-400 text-sm italic">Nenhum projeto ativo</span>'}
                        
                        <!-- Formulário Escondido -->
                        <div id="form-${index}" class="hidden mt-3 bg-white border border-gray-200 p-3 rounded-lg shadow-sm">
                            <input type="text" id="nome-proj-${index}" placeholder="Nome do Projeto" class="w-full mb-2 p-2 text-sm border rounded focus:outline-none focus:ring-1 focus:ring-[#ff5510]">
                            <textarea id="desc-proj-${index}" placeholder="Descrição (aparecerá no ícone !)" class="w-full mb-2 p-2 text-sm border rounded focus:outline-none focus:ring-1 focus:ring-[#ff5510]" rows="2"></textarea>
                            <div class="flex gap-2">
                                <select id="status-proj-${index}" class="flex-1 p-2 text-sm border rounded focus:outline-none focus:ring-1 focus:ring-[#ff5510]">
                                    <option value="Em andamento">Em andamento</option>
                                    <option value="Stand By">Stand By</option>
                                    <option value="Finalizado">Finalizado</option>
                                </select>
                                <button onclick="window.salvarProjeto('${colab.nome}', ${index})" class="bg-[#ff5510] hover:bg-[#e04a0e] text-white px-4 py-2 rounded text-sm font-medium transition-colors">Salvar</button>
                                <button onclick="window.toggleForm(${index})" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded text-sm font-medium transition-colors">Cancelar</button>
                            </div>
                        </div>
                    </td>
                    <td class="p-4 border-t border-gray-100 text-center align-top">
                        <button onclick="window.toggleForm(${index})" class="w-8 h-8 rounded-full bg-gray-100 text-[#ff5510] hover:bg-[#ff5510] hover:text-white transition-colors shadow-sm flex items-center justify-center mx-auto" title="Adicionar Projeto">
                            <i class="fa-solid fa-plus"></i>
                        </button>
                    </td>
                `;
                tabela.appendChild(tr);
            });
        }

        // Funções Globais para o HTML conseguir chamar
        window.toggleForm = (index) => {
            const form = document.getElementById(`form-${index}`);
            form.classList.toggle('hidden');
        };

        window.salvarProjeto = async (nomeColaborador, index) => {
            const nomeProj = document.getElementById(`nome-proj-${index}`).value;
            const descProj = document.getElementById(`desc-proj-${index}`).value;
            const statusProj = document.getElementById(`status-proj-${index}`).value;

            if (!nomeProj) {
                alert("O nome do projeto é obrigatório!");
                return;
            }

            try {
                await addDoc(collection(db, "projetos"), {
                    colaborador: nomeColaborador,
                    nomeProjeto: nomeProj,
                    descricao: descProj,
                    status: statusProj,
                    dataCriacao: new Date()
                });
                window.toggleForm(index);
            } catch (e) {
                console.error("Erro ao adicionar documento: ", e);
                alert("Erro ao salvar o projeto. Verifique o console.");
            }
        };

        window.deletarProjeto = async (id) => {
            if(confirm("Tem certeza que deseja excluir este projeto?")) {
                await deleteDoc(doc(db, "projetos", id));
            }
        };

        window.mudarStatus = async (id, novoStatus) => {
            const projetoRef = doc(db, "projetos", id);
            await updateDoc(projetoRef, {
                status: novoStatus
            });
        };

        // Render inicial vazio até o Firebase carregar
        renderizarTabela();
    </script>
</body>
</html>
